name: Validate YouTube feature
on:
  push:
    branches: [feature/youtube-search]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/kodi-smart-remote-card.js
